<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030817">

  <title>RADHA AI</title>

  <!-- External stylesheet -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!-- Background image is handled by style.css -->
  <div class="scene" aria-hidden="true"></div>

  <div class="app">

    <!-- Top bar -->
    <header class="topbar">
      <button
        class="icon-btn"
        id="openDrawer"
        type="button"
        aria-label="Open recent chats"
      >＋</button>

      <div class="brand">
        <div class="brand-name">RADHA AI</div>
        <div class="brand-sub">
          <span class="online"></span>
          Your personal assistant · Kanha 💙
        </div>
      </div>

      <button
        class="icon-btn"
        id="theme"
        type="button"
        aria-label="Toggle theme"
      >☾</button>
    </header>

    <!-- Full-screen conversation -->
    <main class="chat" id="chat" aria-live="polite">
      <div class="day" id="dayLabel"></div>
    </main>

    <!-- Typing indicator -->
    <div class="typing" id="typing" aria-live="polite">
      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
      RADHA is thinking...
    </div>

    <!-- Message input -->
    <div class="composer-wrap">
      <form class="composer" id="form">
        <button
          class="tool"
          type="button"
          id="attach"
          aria-label="Open chat menu"
        >＋</button>

        <input
          id="message"
          name="message"
          type="text"
          placeholder="Message RADHA, Kanha..."
          autocomplete="off"
          required
        >

        <button
          class="tool"
          type="button"
          id="voice"
          aria-label="Voice input"
        >♩</button>

        <button
          class="send"
          type="submit"
          aria-label="Send message"
        >➤</button>
      </form>
    </div>
  </div>

  <!-- Recent chat drawer -->
  <div class="scrim" id="scrim"></div>

  <aside
    class="drawer"
    id="drawer"
    aria-label="Chat history"
    aria-hidden="true"
  >
    <div class="drawer-head">
      <div class="drawer-title">RADHA AI</div>

      <button
        class="close-btn"
        id="closeDrawer"
        type="button"
        aria-label="Close chat menu"
      >×</button>
    </div>

    <button class="new-chat" id="newChat" type="button">
      ＋ &nbsp; New Chat
    </button>

    <div class="section-label">RECENT CHATS</div>

    <div class="history" id="history"></div>

    <div class="drawer-note">
      Your conversations are saved on this device 💙
    </div>
  </aside>

  <div class="toast" id="toast" role="status"></div>

  <script>
    "use strict";

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const typing = document.getElementById("typing");
    const historyBox = document.getElementById("history");
    const drawer = document.getElementById("drawer");
    const scrim = document.getElementById("scrim");
    const dayLabel = document.getElementById("dayLabel");
    const toast = document.getElementById("toast");

    const WELCOME =
      "Welcome back, Kanha! 💙\nI'm RADHA...\nWhat shall we talk about today?";

    const STORAGE_KEY = "radha-conversations-v2";
    const THEME_KEY = "radha-theme";

    let conversations = [];
    let currentId = null;
    let replyTimer = null;
    let toastTimer = null;

    function makeId() {
      return "chat-" + Date.now() + "-" +
        Math.random().toString(36).slice(2, 8);
    }

    function timeNow() {
      return new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function updateDayLabel() {
      dayLabel.textContent = new Date().toLocaleDateString([], {
        weekday: "short",
        month: "short",
        day: "numeric"
      });
    }

    function loadConversations() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(STORAGE_KEY) || "[]"
        );

        if (Array.isArray(saved)) {
          conversations = saved.filter(item =>
            item &&
            typeof item.id === "string" &&
            Array.isArray(item.messages)
          );
        }
      } catch (error) {
        conversations = [];
      }
    }

    function saveConversations() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(conversations)
        );
      } catch (error) {
        showToast("Chats couldn't be saved on this device.");
      }
    }

    function currentConversation() {
      return conversations.find(item => item.id === currentId);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    function addBubble(message, shouldScroll = true) {
      const row = document.createElement("div");
      row.className = "msg " +
        (message.sender === "user" ? "user" : "bot");

      const who = document.createElement("div");
      who.className = "who";
      who.textContent = message.sender === "user"
        ? "Kanha 💙"
        : "✧ RADHA";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = message.text;

      const time = document.createElement("div");
      time.className = "time";
      time.textContent = message.time || timeNow();

      row.append(who, bubble, time);
      chat.appendChild(row);

      if (shouldScroll) {
        chat.scrollTop = chat.scrollHeight;
      }
    }

    function renderChat() {
      chat.replaceChildren(dayLabel);
      updateDayLabel();

      const conversation = currentConversation();

      if (conversation) {
        conversation.messages.forEach(message => {
          addBubble(message, false);
        });
      }

      chat.scrollTop = chat.scrollHeight;
    }

    function renderHistory() {
      historyBox.replaceChildren();

      if (!conversations.length) {
        const empty = document.createElement("div");
        empty.className = "empty-history";
        empty.textContent =
          "Your previous conversations will appear here.";

        historyBox.appendChild(empty);
        return;
      }

      conversations.forEach(conversation => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "history-item" +
          (conversation.id === currentId ? " active" : "");

        const icon = document.createElement("span");
        icon.className = "history-icon";
        icon.textContent = "▢";

        const title = document.createElement("span");
        title.className = "history-text";
        title.textContent = conversation.title || "New conversation";

        button.append(icon, title);

        button.addEventListener("click", () => {
          currentId = conversation.id;
          renderChat();
          renderHistory();
          closeDrawer();
        });

        historyBox.appendChild(button);
      });
    }

    function createConversation() {
      const conversation = {
        id: makeId(),
        title: "New conversation",
        updated: Date.now(),
        messages: [{
          text: WELCOME,
          sender: "bot",
          time: timeNow()
        }]
      };

      conversations.unshift(conversation);
      currentId = conversation.id;

      saveConversations();
      renderChat();
      renderHistory();
    }

    function saveMessage(text, sender) {
      const conversation = currentConversation();
      if (!conversation) return;

      const message = {
        text: text,
        sender: sender,
        time: timeNow()
      };

      conversation.messages.push(message);
      conversation.updated = Date.now();

      if (
        sender === "user" &&
        conversation.title === "New conversation"
      ) {
        conversation.title = text.length > 32
          ? text.slice(0, 32) + "…"
          : text;
      }

      conversations.sort((a, b) => b.updated - a.updated);

      saveConversations();
      addBubble(message);
      renderHistory();
    }

    function radhaReply(text) {
      const message = text.toLowerCase().trim();

      if (/^(hi|hello|hey|hii|hlo)\b/.test(message)) {
        return "Hey Kanha! 💙 I'm here. How are you today?";
      }

      if (message.includes("your name")) {
        return "I'm RADHA, your personal assistant, Kanha! 💙";
      }

      if (message.includes("good morning")) {
        return "Good morning, Kanha! ☀️";
      }

      if (message.includes("good night")) {
        return "Good night, Kanha! 🌙";
      }

      if (message.includes("thank")) {
        return "You're welcome, Kanha! 💙";
      }

      if (message.includes("time")) {
        return "It's " + new Date().toLocaleTimeString() +
          ", Kanha.";
      }

      if (message.includes("how are you")) {
        return "I'm here and ready to chat with you, Kanha! 💙 What is on your mind?";
      }

      return "I received your message, Kanha! 💙 My real AI brain isn't connected yet. We can connect an AI service in the next stage.";
    }

    function openDrawer() {
      drawer.classList.add("open");
      scrim.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      scrim.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
    }

    document.getElementById("openDrawer")
      .addEventListener("click", openDrawer);

    document.getElementById("closeDrawer")
      .addEventListener("click", closeDrawer);

    scrim.addEventListener("click", closeDrawer);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeDrawer();
    });

    document.getElementById("newChat")
      .addEventListener("click", () => {
        if (replyTimer) clearTimeout(replyTimer);

        typing.classList.remove("show");
        createConversation();
        closeDrawer();
        input.focus();
      });

    document.getElementById("attach")
      .addEventListener("click", openDrawer);

    form.addEventListener("submit", event => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      if (replyTimer) clearTimeout(replyTimer);

      saveMessage(text, "user");
      input.value = "";
      typing.classList.add("show");

      replyTimer = setTimeout(() => {
        typing.classList.remove("show");
        saveMessage(radhaReply(text), "bot");
        replyTimer = null;
      }, 450);
    });

    document.getElementById("voice")
      .addEventListener("click", () => {
        const Speech =
          window.SpeechRecognition ||
          window.webkitSpeechRecognition;

        if (!Speech) {
          showToast("Voice input is not supported in this browser.");
          return;
        }

        const recognition = new Speech();
        recognition.lang = "en-IN";

        recognition.onresult = event => {
          input.value = event.results[0][0].transcript;
          input.focus();
        };

        recognition.onerror = () => {
          showToast("Voice input couldn't start. Try again.");
        };

        recognition.start();
      });

    document.getElementById("theme")
      .addEventListener("click", () => {
        document.body.classList.toggle("light");

        const lightMode = document.body.classList.contains("light");

        document.getElementById("theme").textContent =
          lightMode ? "☀" : "☾";

        try {
          localStorage.setItem(
            THEME_KEY,
            lightMode ? "light" : "dark"
          );
        } catch (error) {}
      });

    /* Restore saved theme */
    try {
      if (localStorage.getItem(THEME_KEY) === "light") {
        document.body.classList.add("light");
        document.getElementById("theme").textContent = "☀";
      }
    } catch (error) {}

    /* Restore chats or start a fresh conversation */
    loadConversations();

    if (conversations.length) {
      conversations.sort((a, b) => b.updated - a.updated);
      currentId = conversations[0].id;
      renderChat();
      renderHistory();
    } else {
      createConversation();
    }
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030817">
<title>RADHA AI</title>

<style>
*{box-sizing:border-box}
:root{
  --gold:#ffdda0;
  --blue:#247bff;
  --line:rgba(112,169,255,.72);
  --glass:rgba(3,12,30,.24);
  --text:#f4f7ff;
  --muted:#c0cee7;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}
body{
  color:var(--text);
  background:#030817;
  font:15px Arial,Helvetica,sans-serif;
}
button,input{font:inherit}
button{color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{
  outline:2px solid #a4d0ff;
  outline-offset:2px;
}

/* Existing moonlight background: do not replace the image */
.background{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    linear-gradient(rgba(1,7,21,.12),rgba(1,7,21,.18)),
    url("radha-bg.png") center center/cover no-repeat;
}
.background:after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(1,7,20,.08);
  pointer-events:none;
}

/* Full-screen chat application */
.app{
  position:relative;
  height:100vh;
  height:100dvh;
  width:100%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:transparent;
}

/* Header */
.header{
  min-height:67px;
  padding:calc(9px + env(safe-area-inset-top)) 14px 10px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid rgba(107,162,255,.42);
  background:rgba(2,9,24,.19);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}
.icon-btn{
  flex-shrink:0;
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border:1px solid rgba(107,169,255,.58);
  border-radius:14px;
  background:rgba(5,22,49,.32);
  color:#a9d0ff;
  font-size:25px;
}
.icon-btn:active{background:rgba(40,104,255,.35)}
.brand{
  flex:1;
  min-width:0;
}
.brand-title{
  color:var(--gold);
  font:23px Georgia,serif;
  letter-spacing:.4px;
}
.brand-subtitle{
  margin-top:4px;
  color:#e0e8f7;
  font-size:11px;
}
.status{
  width:8px;
  height:8px;
  display:inline-block;
  margin-right:5px;
  border-radius:50%;
  background:#58e5a2;
  box-shadow:0 0 8px #58e5a2;
}

/* Conversation */
.conversation{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:18px 15px 22px;
  display:flex;
  flex-direction:column;
  gap:19px;
  scroll-behavior:smooth;
  scrollbar-width:thin;
  scrollbar-color:rgba(117,170,255,.5) transparent;
}
.date-label{
  align-self:center;
  border:1px solid rgba(111,168,255,.4);
  border-radius:22px;
  padding:7px 13px;
  background:rgba(4,18,43,.27);
  color:#e0e9fc;
  font-size:11px;
}
.message{
  width:fit-content;
  max-width:min(86%,620px);
  display:flex;
  flex-direction:column;
  gap:5px;
}
.message.user{
  align-self:flex-end;
  align-items:flex-end;
}
.message.bot{
  align-self:flex-start;
  align-items:flex-start;
}
.sender{
  padding:0 5px;
  color:#c8dcff;
  font-size:12px;
}
.bubble{
  padding:12px 15px;
  border:1px solid rgba(119,169,242,.4);
  border-radius:18px 18px 18px 5px;
  background:rgba(7,23,48,.39);
  color:#f5f7ff;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 12px rgba(0,0,0,.04);
}
.user .bubble{
  border-color:rgba(125,178,255,.7);
  border-radius:18px 18px 5px 18px;
  background:rgba(19,83,210,.77);
}
.message-time{
  padding:0 5px;
  color:#d0dcf1;
  font-size:10px;
}
.typing{
  display:none;
  align-items:center;
  gap:10px;
  padding:0 18px 12px;
  color:#d7e5ff;
  font-size:12px;
}
.typing.show{display:flex}
.dots{display:flex;gap:4px}
.dots i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#79baff;
  animation:pulse .65s infinite alternate;
}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes pulse{
  to{opacity:.25;transform:translateY(-3px)}
}

/* Bottom message input */
.composer-area{
  flex-shrink:0;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(105,163,255,.35);
  background:rgba(2,9,24,.18);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}
.composer{
  width:100%;
  min-height:57px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 7px 5px 10px;
  border:1px solid rgba(100,158,255,.9);
  border-radius:35px;
  background:rgba(3,16,39,.39);
  box-shadow:0 0 17px rgba(32,103,255,.1);
}
.composer input{
  flex:1;
  width:0;
  min-width:0;
  border:0;
  outline:0;
  padding:10px 2px;
  color:white;
  background:transparent;
  font-size:14px;
}
.composer input::placeholder{color:#bdcce5}
.tool{
  width:36px;
  height:40px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#a4ccff;
  font-size:23px;
}
.send{
  width:44px;
  height:44px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border:1px solid #9ac7ff;
  border-radius:50%;
  background:linear-gradient(140deg,#3e91ff,#1051eb);
  color:white;
  font-size:22px;
  box-shadow:0 0 13px rgba(35,109,255,.4);
}

/* Side drawer opened using the top + button */
.scrim{
  position:fixed;
  inset:0;
  z-index:10;
  background:rgba(0,4,14,.5);
  opacity:0;
  visibility:hidden;
  transition:opacity .22s,visibility .22s;
}
.scrim.open{opacity:1;visibility:visible}
.drawer{
  position:fixed;
  z-index:11;
  top:0;
  bottom:0;
  left:0;
  width:min(83vw,340px);
  padding:calc(16px + env(safe-area-inset-top)) 15px calc(16px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:15px;
  border-right:1px solid var(--line);
  background:rgba(3,12,30,.88);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  transform:translateX(-105%);
  transition:transform .24s ease;
}
.drawer.open{transform:translateX(0)}
.drawer-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.drawer-title{
  color:var(--gold);
  font:25px Georgia,serif;
}
.close-drawer{
  width:38px;
  height:38px;
  border:1px solid rgba(119,174,255,.5);
  border-radius:12px;
  background:rgba(15,41,79,.5);
  color:#c7ddff;
  font-size:22px;
}
.new-chat{
  width:100%;
  padding:13px;
  border:1px solid rgba(116,175,255,.7);
  border-radius:13px;
  background:linear-gradient(110deg,rgba(31,105,255,.85),rgba(6,48,139,.8));
  text-align:left;
}
.drawer-label{
  color:#ffdda0;
  font-size:12px;
  letter-spacing:.6px;
}
.history{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:5px;
  overflow-y:auto;
}
.history-item{
  width:100%;
  padding:11px;
  border:1px solid transparent;
  border-radius:11px;
  background:transparent;
  text-align:left;
  color:#eef4ff;
  overflow-wrap:anywhere;
}
.history-item:hover,.history-item.selected{
  border-color:rgba(107,164,255,.42);
  background:rgba(24,65,126,.42);
}
.history-item small{
  display:block;
  margin-top:5px;
  color:#b9c9e3;
  font-size:10px;
}
.drawer-note{
  padding-top:12px;
  border-top:1px solid rgba(112,162,231,.24);
  color:#c6d4ea;
  font-size:11px;
  text-align:center;
}
@media(min-width:800px){
  .header{padding-left:24px;padding-right:24px;min-height:76px}
  .conversation{padding:24px clamp(22px,5vw,80px);gap:22px}
  .composer-area{padding:12px 24px 18px}
  .composer{max-width:1100px;margin:auto;min-height:62px}
  .bubble{padding:14px 18px;font-size:15px}
}
@media(max-width:380px){
  .header{gap:8px;padding-left:9px;padding-right:9px}
  .brand-title{font-size:20px}
  .brand-subtitle{font-size:10px}
  .icon-btn{width:39px;height:39px}
  .conversation{padding:14px 10px}
  .message{max-width:91%}
  .bubble{padding:10px 12px;font-size:14px}
  .composer-area{padding-left:8px;padding-right:8px}
  .tool{width:31px}
  .send{width:40px;height:40px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<div class="background" aria-hidden="true"></div>

<div class="app">
  <header class="header">
    <button class="icon-btn" id="openDrawer" aria-label="Open chats">＋</button>
    <div class="brand">
      <div class="brand-title">RADHA AI</div>
      <div class="brand-subtitle">
        <span class="status"></span>Your personal assistant · Kanha 💙
      </div>
    </div>
    <button class="icon-btn" id="theme" aria-label="Change glass brightness">☾</button>
  </header>

  <main class="conversation" id="conversation" aria-live="polite"></main>

  <div class="typing" id="typing">
    <div class="dots"><i></i><i></i><i></i></div>
    RADHA is thinking...
  </div>

  <div class="composer-area">
    <form class="composer" id="form">
      <button class="tool" id="attach" type="button" aria-label="Attachment">＋</button>
      <input id="message" placeholder="Message RADHA, Kanha..." autocomplete="off" required>
      <button class="tool" id="voice" type="button" aria-label="Voice input">♩</button>
      <button class="send" type="submit" aria-label="Send">➤</button>
    </form>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-label="Previous conversations" aria-hidden="true">
  <div class="drawer-top">
    <div class="drawer-title">RADHA <span style="color:#55aaff">AI</span></div>
    <button class="close-drawer" id="closeDrawer" aria-label="Close chats">×</button>
  </div>

  <button class="new-chat" id="newChat">＋ &nbsp; New Chat</button>
  <div class="drawer-label">RECENT CHATS</div>
  <div class="history" id="history"></div>
  <div class="drawer-note">Your conversations · Kanha 💙</div>
</aside>

<script>
const conversation = document.getElementById("conversation");
const form = document.getElementById("form");
const input = document.getElementById("message");
const typing = document.getElementById("typing");
const drawer = document.getElementById("drawer");
const scrim = document.getElementById("scrim");
const historyBox = document.getElementById("history");

const STORAGE_KEY = "radha-conversations-v2";
const CURRENT_KEY = "radha-active-chat-v2";

let chats = [];
let activeId = null;
let replyTimer = null;
let brightGlass = false;

function makeId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function clock(){
  return new Date().toLocaleTimeString([],{
    hour:"2-digit",minute:"2-digit"
  });
}
function save(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(chats));
    localStorage.setItem(CURRENT_KEY,activeId || "");
  }catch(e){}
}
function currentChat(){
  return chats.find(c=>c.id===activeId);
}
function createChat(showWelcome=true){
  const c={id:makeId(),title:"New Chat",messages:[],updated:Date.now()};
  chats.unshift(c);
  activeId=c.id;
  save();
  renderChat();
  renderHistory();
  closeDrawer();
  if(showWelcome){
    addMessage(
      "Welcome back, Kanha! 💙\nI'm RADHA...\nWhat shall we talk about today?",
      "bot"
    );
  }
  input.focus();
}
function renderChat(){
  conversation.replaceChildren();
  const c=currentChat();
  if(!c)return;

  if(c.messages.length){
    const date=document.createElement("div");
    date.className="date-label";
    date.textContent="Today";
    conversation.appendChild(date);
  }

  c.messages.forEach(m=>drawMessage(m,false));
  conversation.scrollTop=conversation.scrollHeight;
}
function drawMessage(m,scroll=true){
  const row=document.createElement("div");
  row.className="message "+(m.sender==="user"?"user":"bot");

  const sender=document.createElement("div");
  sender.className="sender";
  sender.textContent=m.sender==="user"?"Kanha 💙":"✧ RADHA";

  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=m.text;

  const time=document.createElement("div");
  time.className="message-time";
  time.textContent=m.time || clock();

  row.append(sender,bubble,time);
  conversation.appendChild(row);
  if(scroll)conversation.scrollTop=conversation.scrollHeight;
}
function addMessage(text,sender){
  const c=currentChat();
  if(!c)return;
  const m={text,sender,time:clock()};
  c.messages.push(m);
  c.updated=Date.now();

  if(sender==="user" && c.title==="New Chat"){
    c.title=text.length>32?text.slice(0,32)+"…":text;
  }

  drawMessage(m);
  save();
  renderHistory();
}
function renderHistory(){
  historyBox.replaceChildren();
  if(!chats.length){
    const empty=document.createElement("div");
    empty.className="drawer-note";
    empty.textContent="Your new conversations will appear here.";
    historyBox.appendChild(empty);
    return;
  }

  chats.slice().sort((a,b)=>b.updated-a.updated).forEach(c=>{
    const button=document.createElement("button");
    button.className="history-item"+(c.id===activeId?" selected":"");
    button.textContent="▢  "+c.title;

    const small=document.createElement("small");
    small.textContent=c.messages.length
      ? c.messages.length+" messages"
      : "New conversation";
    button.appendChild(small);

    button.addEventListener("click",()=>{
      activeId=c.id;
      save();
      renderChat();
      renderHistory();
      closeDrawer();
    });
    historyBox.appendChild(button);
  });
}
function openDrawer(){
  drawer.classList.add("open");
  scrim.classList.add("open");
  drawer.setAttribute("aria-hidden","false");
}
function closeDrawer(){
  drawer.classList.remove("open");
  scrim.classList.remove("open");
  drawer.setAttribute("aria-hidden","true");
}
function radhaReply(text){
  const m=text.toLowerCase().trim();
  if(/^(hi|hello|hey|hii)\b/.test(m))
    return "Hey Kanha! 💙 I'm here. How are you today?";
  if(m.includes("your name"))
    return "I'm RADHA, your personal assistant, Kanha! 💙";
  if(m.includes("good morning"))
    return "Good morning, Kanha! ☀️ Hope you have a lovely day.";
  if(m.includes("good night"))
    return "Good night, Kanha! 🌙 Take care.";
  if(m.includes("thank"))
    return "You're welcome, Kanha! 💙";
  if(m.includes("time"))
    return "It's "+new Date().toLocaleTimeString()+", Kanha.";
  if(m.includes("how are you"))
    return "I'm here with you, Kanha! 💙 What would you like to talk about?";
  return "I got your message, Kanha! 💙 My real AI service isn't connected yet. Once we connect an AI API, I can answer a much wider range of questions.";
}

form.addEventListener("submit",e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text)return;

  addMessage(text,"user");
  input.value="";
  typing.classList.add("show");
  clearTimeout(replyTimer);

  replyTimer=setTimeout(()=>{
    typing.classList.remove("show");
    addMessage(radhaReply(text),"bot");
  },500);
});

document.getElementById("openDrawer").addEventListener("click",openDrawer);
document.getElementById("closeDrawer").addEventListener("click",closeDrawer);
scrim.addEventListener("click",closeDrawer);

document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeDrawer();
});

document.getElementById("newChat").addEventListener("click",()=>{
  clearTimeout(replyTimer);
  typing.classList.remove("show");
  createChat(true);
});

document.getElementById("voice").addEventListener("click",()=>{
  const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Speech){
    alert("Voice input is not supported in this browser.");
    return;
  }
  const recognition=new Speech();
  recognition.lang="en-IN";
  recognition.onresult=e=>{
    input.value=e.results[0][0].transcript;
    input.focus();
  };
  recognition.onerror=()=>alert("Voice input stopped. Please try again.");
  recognition.start();
});

document.getElementById("attach").addEventListener("click",()=>{
  alert("Attachment support will be added in a future update.");
});

document.getElementById("theme").addEventListener("click",()=>{
  brightGlass=!brightGlass;
  document.querySelector(".header").style.background=
    brightGlass?"rgba(2,9,24,.36)":"rgba(2,9,24,.19)";
  document.querySelector(".composer-area").style.background=
    brightGlass?"rgba(2,9,24,.34)":"rgba(2,9,24,.18)";
  document.querySelectorAll(".bubble").forEach(b=>{
    b.style.backdropFilter=brightGlass?"blur(8px)":"blur(4px)";
  });
  document.getElementById("theme").textContent=brightGlass?"☀":"☾";
});

try{
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
  if(Array.isArray(saved)){
    chats=saved.filter(c=>c&&typeof c.id==="string"&&Array.isArray(c.messages));
  }
}catch(e){chats=[]}

const previousId=localStorage.getItem(CURRENT_KEY);
if(previousId&&chats.some(c=>c.id===previousId)){
  activeId=previousId;
}else if(chats.length){
  activeId=chats[0].id;
}

if(!activeId){
  createChat(true);
}else{
  renderChat();
  renderHistory();
}
</script>
</body>
</html>
